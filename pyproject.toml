[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "driftwatch"
version = "0.2.0"
description = "A Longitudinal and Explainable Framework for Detecting Dangerous Behavioural Changes in Browser-Extension Updates"
authors = [{ name = "DriftWatch Research Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "jinja2>=3.1.3",
    "python-multipart>=0.0.9",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "pytest>=8.1.1",
    "pandas>=2.2.1",
    "numpy>=1.26.4",
    "scikit-learn>=1.4.1",
    "tldextract>=5.1.2",
    "httpx>=0.27.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::Warning"
]
